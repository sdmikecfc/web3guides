<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @font-face { font-family:'Aktiv Grotesk'; font-weight:400; font-style:normal; font-display:swap; src:url('fonts/AktivGrotesk_Rg.ttf') format('truetype'); }
  @font-face { font-family:'Aktiv Grotesk'; font-weight:500; font-style:normal; font-display:swap; src:url('fonts/AktivGrotesk_Md.ttf') format('truetype'); }
  @font-face { font-family:'Aktiv Grotesk Ex'; font-weight:700; font-style:normal; font-display:swap; src:url('fonts/AktivGroteskEx_Bd.ttf') format('truetype'); }
  @font-face { font-family:'Aktiv Grotesk Ex'; font-weight:900; font-style:normal; font-display:swap; src:url('fonts/AktivGroteskEx_Blk.ttf') format('truetype'); }
  @font-face { font-family:'Aktiv Grotesk Cd'; font-weight:500; font-style:normal; font-display:swap; src:url('fonts/AktivGroteskCd_Md.ttf') format('truetype'); }
  @font-face { font-family:'Aktiv Grotesk Cd'; font-weight:700; font-style:normal; font-display:swap; src:url('fonts/AktivGroteskCd_Bd.ttf') format('truetype'); }

  html, body { margin:0; padding:0; background:#060912; }
  *, *::before, *::after { box-sizing:border-box; }
  a { color:#4dd8e6; text-decoration:none; }
  a:hover { color:#8fe9f2; }

  @keyframes lwShine { 0% { background-position:230% 0; } 100% { background-position:-130% 0; } }
  @keyframes lwShimmer { 0% { background-position:0 0; opacity:.35; } 50% { opacity:.8; } 100% { background-position:120px 0; opacity:.35; } }
  @keyframes lwGlint { 0%,100% { opacity:.3; transform:scaleY(.9); } 50% { opacity:.9; transform:scaleY(1.06); } }
  @keyframes lwSway  { 0%,100% { transform:rotate(-1.5deg); } 50% { transform:rotate(1.6deg); } }
  @keyframes lwSwayR { 0%,100% { transform:rotate(1.5deg); } 50% { transform:rotate(-1.6deg); } }
  @keyframes lwBokeh { 0% { transform:translate(0,0); opacity:0; } 14% { opacity:.75; } 82% { opacity:.6; } 100% { transform:translate(16px,-46px); opacity:0; } }
  @keyframes lwFloat { 0%,100% { transform:translateY(0) rotate(-1.2deg); } 50% { transform:translateY(-12px) rotate(1.2deg); } }
  @keyframes lwPulse { 0%,100% { box-shadow:0 8px 24px rgba(240,179,64,.34), 0 0 0 rgba(240,179,64,0), inset 0 1px 0 rgba(255,255,255,.65); } 50% { box-shadow:0 12px 40px rgba(240,179,64,.6), 0 0 26px rgba(240,179,64,.32), inset 0 1px 0 rgba(255,255,255,.75); } }
  @keyframes lwTwinkle { 0%,100% { opacity:.18; transform:scale(.7); } 50% { opacity:1; transform:scale(1.1); } }
  @keyframes lwBreathe { 0%,100% { opacity:.72; transform:translate(-50%,-50%) scale(.98); } 50% { opacity:1; transform:translate(-50%,-50%) scale(1.03); } }

  .lw-bokeh { position:absolute; border-radius:50%; filter:blur(7px); pointer-events:none; opacity:.5; }
  .lw-spark { position:absolute; border-radius:50%; pointer-events:none; background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,236,190,.5) 40%, rgba(255,236,190,0) 70%); opacity:.4; }
  .lw-spark::before, .lw-spark::after { content:""; position:absolute; left:50%; top:50%; background:linear-gradient(var(--dir), transparent, rgba(255,255,255,.85), transparent); }
  .lw-spark::before { width:1.5px; height:340%; transform:translate(-50%,-50%); }
  .lw-spark::after  { height:1.5px; width:340%;  transform:translate(-50%,-50%); }

  @media (prefers-reduced-motion: no-preference) {
    .lw-shine   { animation: lwShine 6s ease-in-out 1.2s infinite; }
    .lw-ocean-sh{ animation: lwShimmer 7s linear infinite; }
    .lw-glint   { animation: lwGlint 4.5s ease-in-out infinite; }
    .lw-palm-l  { animation: lwSway  9s ease-in-out infinite; }
    .lw-palm-r  { animation: lwSwayR 11s ease-in-out infinite; }
    .lw-bokeh   { animation: lwBokeh var(--dur,14s) ease-in-out var(--delay,0s) infinite; opacity:0; }
    .lw-spark   { animation: lwTwinkle var(--dur,5s) ease-in-out var(--delay,0s) infinite; }
    .lw-float   { animation: lwFloat 6.5s ease-in-out infinite; }
    .lw-cta     { animation: lwPulse 3.4s ease-in-out infinite; }
    .lw-glow    { animation: lwBreathe var(--dur,9s) ease-in-out var(--delay,0s) infinite; }
  }

  @media (max-width: 860px) {
    .lw-girl-side { display:none !important; }
    .lw-glow-side { display:none !important; }
  }
  @media (max-width: 600px) {
    .lw-data { flex-direction:column !important; align-items:stretch !important; gap:12px !important; }
    .lw-data-div { display:none !important; }
    .lw-palm-l, .lw-palm-r { opacity:.55; }
  }
</style>
</helmet>

<div style="position:relative; width:100%; min-height:100vh; overflow:hidden; background:#060912; isolation:isolate; font-family:'Aktiv Grotesk', system-ui, -apple-system, sans-serif;">

  <!-- SKY -->
  <div style="position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, #080a1e 0%, #1a123c 15%, #3a1a56 29%, #6c2a5e 43%, #b23f56 55%, #ec6a45 63%, #ffa85a 68%, #ffce85 72%, #7a3a52 80%, #1b1428 90%, #0a0716 100%);"></div>

  <!-- SUN -->
  <div style="position:absolute; z-index:2; left:50%; top:60%; width:min(820px,78vw); height:min(820px,78vw); transform:translate(-50%,-50%); background:radial-gradient(circle, #fff6da 0%, #ffe6ac 16%, #ffbf6e 32%, rgba(255,150,82,.55) 48%, rgba(255,120,90,.16) 66%, rgba(255,110,100,0) 78%); pointer-events:none;"></div>

  <!-- OCEAN -->
  <div style="position:absolute; z-index:3; left:0; right:0; top:63%; height:22%; background:linear-gradient(180deg, #ffd28c 0%, #ff9f5f 12%, #d8636e 38%, #8a3a68 70%, #3f2050 100%);"></div>
  <!-- sun glitter column on ocean -->
  <div class="lw-glint" style="position:absolute; z-index:4; left:50%; top:63%; width:min(320px,34vw); height:22%; transform:translateX(-50%); background:linear-gradient(180deg, rgba(255,244,214,.85) 0%, rgba(255,206,140,.45) 45%, rgba(255,180,120,.05) 100%); -webkit-mask-image:linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); mask-image:linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); mix-blend-mode:screen; pointer-events:none;"></div>
  <!-- ocean shimmer bands -->
  <div class="lw-ocean-sh" style="position:absolute; z-index:4; left:0; right:0; top:64%; height:20%; background:repeating-linear-gradient(0deg, rgba(255,244,220,0) 0 5px, rgba(255,244,220,.14) 5px 6px); background-size:100% 12px; mix-blend-mode:screen; pointer-events:none;"></div>

  <!-- INFINITY POOL FOREGROUND -->
  <div style="position:absolute; z-index:5; left:0; right:0; top:82%; bottom:0; background:linear-gradient(180deg, #123049 0%, #0b2135 45%, #071320 100%);"></div>
  <!-- reflected warm streak on pool -->
  <div class="lw-glint" style="position:absolute; z-index:6; left:50%; top:82%; width:min(360px,40vw); bottom:0; transform:translateX(-50%); background:linear-gradient(180deg, rgba(255,190,120,.5) 0%, rgba(255,150,110,.12) 60%, transparent 100%); -webkit-mask-image:linear-gradient(90deg, transparent, #000 40%, #000 60%, transparent); mask-image:linear-gradient(90deg, transparent, #000 40%, #000 60%, transparent); mix-blend-mode:screen; pointer-events:none;"></div>
  <!-- infinity edge glow line -->
  <div style="position:absolute; z-index:6; left:0; right:0; top:81.4%; height:2px; background:linear-gradient(90deg, transparent 4%, rgba(120,226,255,.55) 30%, rgba(255,224,164,.85) 50%, rgba(120,226,255,.55) 70%, transparent 96%); box-shadow:0 0 22px rgba(120,220,255,.5), 0 0 40px rgba(255,200,140,.3); pointer-events:none;"></div>

  <!-- PALMS -->
  <sc-if value="{{ showPalms }}" hint-placeholder-val="{{ true }}">
    <div>
      <div class="lw-palm-l" style="position:absolute; z-index:7; bottom:-16px; left:-34px; height:clamp(340px,58vh,650px); transform-origin:bottom center; pointer-events:none;">
        <svg viewBox="0 0 220 460" height="100%" style="display:block; filter:drop-shadow(0 0 20px rgba(0,0,0,.35));">
          <g fill="#100918">
            <path d="M96,460 C90,360 86,282 108,196 C112,178 121,170 131,166 L139,178 C123,186 118,202 116,242 C114,302 116,382 118,460 Z"/>
            <path d="M129,168 C121,120 119,84 127,50 C137,86 139,124 135,170 Z"/>
            <path d="M129,168 C151,120 181,96 216,84 C183,104 157,130 137,172 Z"/>
            <path d="M129,170 C161,166 193,176 218,198 C187,186 155,182 131,178 Z"/>
            <path d="M131,174 C159,192 181,222 191,258 C169,225 145,199 127,180 Z"/>
            <path d="M129,168 C105,124 74,102 38,90 C74,110 100,134 133,172 Z"/>
            <path d="M129,170 C97,168 64,180 39,204 C72,190 105,184 131,176 Z"/>
            <path d="M131,174 C102,196 82,226 74,262 C94,226 116,199 133,180 Z"/>
          </g>
        </svg>
      </div>
      <div class="lw-palm-r" style="position:absolute; z-index:7; bottom:-22px; right:-44px; height:clamp(300px,52vh,600px); transform-origin:bottom center; pointer-events:none;">
        <svg viewBox="0 0 220 460" height="100%" style="display:block; transform:scaleX(-1); filter:drop-shadow(0 0 20px rgba(0,0,0,.35));">
          <g fill="#0d0715">
            <path d="M96,460 C90,360 86,282 108,196 C112,178 121,170 131,166 L139,178 C123,186 118,202 116,242 C114,302 116,382 118,460 Z"/>
            <path d="M129,168 C121,120 119,84 127,50 C137,86 139,124 135,170 Z"/>
            <path d="M129,168 C151,120 181,96 216,84 C183,104 157,130 137,172 Z"/>
            <path d="M129,170 C161,166 193,176 218,198 C187,186 155,182 131,178 Z"/>
            <path d="M131,174 C159,192 181,222 191,258 C169,225 145,199 127,180 Z"/>
            <path d="M129,168 C105,124 74,102 38,90 C74,110 100,134 133,172 Z"/>
            <path d="M129,170 C97,168 64,180 39,204 C72,190 105,184 131,176 Z"/>
            <path d="M131,174 C102,196 82,226 74,262 C94,226 116,199 133,180 Z"/>
          </g>
        </svg>
      </div>
    </div>
  </sc-if>

  <!-- VIGNETTE (glow-out-of-darkness) -->
  <div style="position:absolute; inset:0; z-index:9; pointer-events:none; background:radial-gradient(118% 86% at 50% 44%, transparent 40%, rgba(6,9,18,.42) 74%, rgba(6,9,18,.78) 100%), linear-gradient(180deg, rgba(6,9,18,.72) 0%, rgba(6,9,18,.1) 15%, rgba(6,9,18,0) 40%, rgba(6,9,18,0) 68%, rgba(6,9,18,.72) 86%, rgba(6,9,18,.96) 100%);"></div>

  <!-- BOKEH + SPARKLES -->
  <div style="position:absolute; inset:0; z-index:8; pointer-events:none; overflow:hidden;">
    <sc-for list="{{ bokeh }}" as="b" hint-placeholder-count="9">
      <div class="lw-bokeh" style="top:{{ b.top }}; left:{{ b.left }}; width:{{ b.size }}; height:{{ b.size }}; background:{{ b.bg }}; --dur:{{ b.dur }}; --delay:{{ b.delay }};"></div>
    </sc-for>
    <sc-for list="{{ sparkles }}" as="s" hint-placeholder-count="5">
      <div class="lw-spark" style="top:{{ s.top }}; left:{{ s.left }}; width:{{ s.size }}; height:{{ s.size }}; --dir:{{ s.dir }}; --dur:{{ s.dur }}; --delay:{{ s.delay }};"></div>
    </sc-for>
  </div>

  <!-- TITLE BLOCK -->
  <div style="position:absolute; z-index:11; top:6.5%; left:50%; transform:translateX(-50%); width:min(1120px,92%); text-align:center; pointer-events:none;">
    <div style="font-family:'Aktiv Grotesk Cd', sans-serif; font-weight:700; font-size:clamp(11px,1.4vw,15px); letter-spacing:.42em; text-transform:uppercase; color:#ffd7a0; text-shadow:0 1px 14px rgba(255,140,90,.5); margin-bottom:clamp(10px,1.6vh,20px);">Launch&nbsp;Wars&nbsp;&nbsp;&middot;&nbsp;&nbsp;Season&nbsp;4</div>

    <div style="position:relative; display:inline-block;">
      <div style="font-family:'Aktiv Grotesk Ex', sans-serif; font-weight:900; font-size:clamp(46px,9vw,138px); line-height:.9; letter-spacing:-.01em; text-transform:uppercase; background:linear-gradient(96deg, #ff4f9d 0%, #ff86ae 26%, #ffd07f 66%, #f0b340 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 26px rgba(255,90,150,.35));">Doma&nbsp;Beach<br>Party</div>
      <div class="lw-shine" aria-hidden="true" style="position:absolute; inset:0; font-family:'Aktiv Grotesk Ex', sans-serif; font-weight:900; font-size:clamp(46px,9vw,138px); line-height:.9; letter-spacing:-.01em; text-transform:uppercase; background:linear-gradient(100deg, transparent 40%, rgba(255,255,255,.9) 49%, rgba(255,255,255,.9) 51%, transparent 60%); background-size:260% 100%; background-position:230% 0; -webkit-background-clip:text; background-clip:text; color:transparent;">Doma&nbsp;Beach<br>Party</div>
    </div>

    <div style="font-family:'Aktiv Grotesk', sans-serif; font-weight:400; font-size:clamp(15px,1.9vw,22px); color:rgba(248,253,255,.85); margin-top:clamp(14px,2vh,26px); letter-spacing:.01em; text-shadow:0 2px 18px rgba(0,0,0,.5);">Three teams. Five domains. One endless summer.</div>
  </div>

  <!-- CHARACTER GLOWS -->
  <div class="lw-glow lw-glow-side" style="position:absolute; z-index:12; left:23.5%; top:66%; width:clamp(320px,34vw,540px); height:clamp(320px,34vw,540px); transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(240,179,64,.85) 0%, rgba(240,179,64,.3) 32%, rgba(240,179,64,0) 64%); mix-blend-mode:screen; filter:blur(24px); pointer-events:none; opacity:{{ glowOpacity }}; --dur:8s; --delay:0s;"></div>
  <div class="lw-glow lw-glow-side" style="position:absolute; z-index:12; left:76.5%; top:66%; width:clamp(320px,34vw,540px); height:clamp(320px,34vw,540px); transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(77,216,230,.85) 0%, rgba(77,216,230,.28) 32%, rgba(77,216,230,0) 64%); mix-blend-mode:screen; filter:blur(24px); pointer-events:none; opacity:{{ glowOpacity }}; --dur:10s; --delay:1.5s;"></div>
  <div class="lw-glow" style="position:absolute; z-index:12; left:50%; top:63%; width:clamp(380px,40vw,620px); height:clamp(380px,40vw,620px); transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(255,126,182,.9) 0%, rgba(255,126,182,.32) 32%, rgba(255,126,182,0) 64%); mix-blend-mode:screen; filter:blur(26px); pointer-events:none; opacity:{{ glowOpacity }}; --dur:9s; --delay:.7s;"></div>

  <!-- CHARACTERS -->
  <div class="lw-girl-side" style="position:absolute; z-index:21; bottom:3%; left:22%; transform:translateX(-50%); width:clamp(260px,27vw,410px); height:clamp(360px,66vh,760px);">
    <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="lw-girl-left" shape="rect" fit="contain" placeholder="Left leader — GOLD team (transparent PNG)" hint-size="100%,100%"></x-import>
  </div>
  <div class="lw-girl-side" style="position:absolute; z-index:21; bottom:3%; left:78%; transform:translateX(-50%); width:clamp(260px,27vw,410px); height:clamp(360px,66vh,760px);">
    <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="lw-girl-right" shape="rect" fit="contain" placeholder="Right leader — AQUA team (transparent PNG)" hint-size="100%,100%"></x-import>
  </div>
  <div style="position:absolute; z-index:23; bottom:5.5%; left:50%; transform:translateX(-50%); width:clamp(300px,35vw,470px); height:clamp(420px,76vh,860px);">
    <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="lw-girl-center" shape="rect" fit="contain" placeholder="Center leader — PINK team (transparent PNG)" hint-size="100%,100%"></x-import>
  </div>

  <!-- FLAMINGO FLOAT -->
  <sc-if value="{{ showFlamingo }}" hint-placeholder-val="{{ true }}">
    <div class="lw-float" style="position:absolute; z-index:26; bottom:1.5%; left:9%; width:clamp(150px,17vw,242px); pointer-events:none; filter:drop-shadow(0 12px 22px rgba(0,0,0,.4));">
      <svg viewBox="0 0 300 220" width="100%" style="display:block;">
        <ellipse cx="152" cy="182" rx="112" ry="22" fill="rgba(0,0,0,.22)"/>
        <ellipse cx="150" cy="150" rx="120" ry="56" fill="#ff92b3"/>
        <ellipse cx="150" cy="145" rx="120" ry="50" fill="#ffa9c2"/>
        <ellipse cx="150" cy="151" rx="70" ry="29" fill="#0c2233"/>
        <ellipse cx="150" cy="149" rx="70" ry="27" fill="#0e2a3e"/>
        <ellipse cx="120" cy="132" rx="66" ry="15" fill="rgba(255,255,255,.32)"/>
        <path d="M96,150 C84,110 90,72 116,56 C104,82 106,116 120,150 Z" fill="#ff92b3"/>
        <path d="M96,150 C86,116 90,86 108,66 C101,90 104,120 116,150 Z" fill="#ffa9c2"/>
        <circle cx="118" cy="52" r="16" fill="#ff92b3"/>
        <circle cx="118" cy="50" r="13" fill="#ffb0c8"/>
        <path d="M105,50 L84,58 L106,64 Z" fill="#ffce5b"/>
        <path d="M84,58 L92,60 L90,55 Z" fill="#1a1420"/>
        <circle cx="122" cy="49" r="2.6" fill="#241018"/>
      </svg>
    </div>
  </sc-if>

  <!-- DATA STRIP + CTAS -->
  <div style="position:absolute; z-index:40; bottom:4.5%; left:50%; transform:translateX(-50%); width:min(1000px,92%); display:flex; flex-direction:column; align-items:center; gap:clamp(18px,2.6vh,28px);">

    <div class="lw-data" style="display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:clamp(16px,2.4vw,32px); padding:14px clamp(20px,2.8vw,36px); border-radius:16px; background:rgba(248,253,255,.05); border:1px solid rgba(248,253,255,.13); backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3); box-shadow:0 10px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.09);">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="width:8px; height:8px; border-radius:50%; background:#f0b340; box-shadow:0 0 10px #f0b340;"></span>
        <span style="font-family:'Aktiv Grotesk Cd', sans-serif; font-weight:700; font-size:clamp(15px,1.5vw,19px); color:#ffd27a; letter-spacing:.01em;">2/5</span>
        <span style="font-family:'Aktiv Grotesk Cd', sans-serif; font-weight:500; font-size:clamp(10px,1vw,12px); letter-spacing:.2em; text-transform:uppercase; color:rgba(248,253,255,.62);">Domains bonded</span>
      </div>
      <span class="lw-data-div" style="width:1px; height:26px; background:rgba(248,253,255,.16);"></span>
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="width:8px; height:8px; border-radius:50%; background:#3de3a4; box-shadow:0 0 10px #3de3a4;"></span>
        <span style="font-family:'Aktiv Grotesk Cd', sans-serif; font-weight:700; font-size:clamp(15px,1.5vw,19px); color:#7bf0c4; letter-spacing:.01em; font-variant-numeric:tabular-nums;">$400 / $1,000</span>
        <span style="font-family:'Aktiv Grotesk Cd', sans-serif; font-weight:500; font-size:clamp(10px,1vw,12px); letter-spacing:.2em; text-transform:uppercase; color:rgba(248,253,255,.62);">Unlocked</span>
      </div>
      <span class="lw-data-div" style="width:1px; height:26px; background:rgba(248,253,255,.16);"></span>
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="width:8px; height:8px; border-radius:50%; background:#4dd8e6; box-shadow:0 0 10px #4dd8e6;"></span>
        <span style="font-family:'Aktiv Grotesk Cd', sans-serif; font-weight:500; font-size:clamp(10px,1vw,12px); letter-spacing:.2em; text-transform:uppercase; color:rgba(248,253,255,.62);">Season ends</span>
        <span style="font-family:'Aktiv Grotesk Cd', sans-serif; font-weight:700; font-size:clamp(15px,1.5vw,19px); color:#8fe9f2; letter-spacing:.01em; font-variant-numeric:tabular-nums;">12d 4h</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:14px;">
      <button class="lw-cta" onClick="{{ onJoin }}" style="font-family:'Aktiv Grotesk', sans-serif; font-weight:600; font-size:clamp(15px,1.4vw,17px); letter-spacing:.01em; color:#3a2200; background:linear-gradient(180deg, #ffe4a4 0%, #f0b340 54%, #e19c28 100%); border:none; padding:15px 34px; border-radius:12px; cursor:pointer;" style-hover="filter:brightness(1.06); transform:translateY(-1px);">Join the party</button>
      <button onClick="{{ onSee }}" style="font-family:'Aktiv Grotesk', sans-serif; font-weight:500; font-size:clamp(15px,1.4vw,17px); color:#F8FDFF; background:rgba(248,253,255,.06); border:1px solid rgba(248,253,255,.28); padding:15px 30px; border-radius:12px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);" style-hover="background:rgba(248,253,255,.13); border-color:rgba(248,253,255,.5);">See the beach</button>
    </div>
  </div>
